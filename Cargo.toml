# Derived in part from duckdb/extension-template-rs (commit abb7b2f3f954a47f90fc37a99cda3ce0618e6094)
[package]
name = "duckaki"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = true
panic = "unwind"

[profile.dev]
panic = "unwind"

[[example]]
name = "duckaki"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[features]
default = ["delivered-eastmoney"]
test-support = []
delivered-eastmoney = []
[dependencies]
duckdb = { version = "=1.10505.0", features = ["loadable-extension"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
